# 데이터 경로
data:
  raw_dir: "./data/raw"
  processed_dir: "./data/processed/frames_16"
  splits_dir: "./data/splits"
  num_frames: 16
  image_size: 224

# 학습 설정
training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: "cuda"  # or "cpu"

# 모델 설정
model:
  architecture: "resnet_lstm"
  pretrained: true
  hidden_size: 512
  num_layers: 2
  dropout: 0.5

# 체크포인트
checkpoint:
  save_dir: "./checkpoints/frames_16"
  save_interval: 5  # 몇 epoch마다 저장
  keep_last: 3      # 최근 몇 개 유지

# 로그
logging:
  log_dir: "./logs"
  tensorboard_dir: "./logs/tensorboard"